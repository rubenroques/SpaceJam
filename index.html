<!DOCTYPE html>
<html>
<head>

<style type="text/css">
html { background: #02030a; height: 100%; }
body {
	background-color: #02030a;   /* the star tiles come from paintStars() in helpers.js */
	font-family: monospace; color: #cde;
	transition: background-color 2.5s;
    margin: 0;
    overflow: hidden;
    height: 100%;
}

/* Scale canvas with resize attribute to full size */
canvas[resize] {
	background: transparent;
    width: 100%;
    height: 100%;
}
#hud { position: fixed; top: 12px; left: 16px; font-size: 16px; pointer-events: none; }
#hud span { margin-right: 18px; }
#fuelbar { width: 160px; height: 8px; border: 1px solid #567; margin-top: 6px; }
#fuel { height: 100%; width: 100%; background: #fc5; }
#region { margin-top: 8px; font-size: 13px; letter-spacing: 1px; }
#where { margin-top: 2px; font-size: 12px; opacity: 0.6; }
#banner { position: fixed; top: 16%; width: 100%; text-align: center; font-size: 22px; letter-spacing: 4px; opacity: 0; pointer-events: none; }
#banner.show { animation: banner 3.5s; }
@keyframes banner { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
#over { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 32px; pointer-events: none; }
#over[hidden] { display: none; }
#flash { position: fixed; inset: 0; background: #f33; opacity: 0; pointer-events: none; transition: opacity 0.6s; }
.shake { animation: shake 0.4s; }
@keyframes shake { 20% { transform: translate(-8px, 6px); } 40% { transform: translate(7px, -5px); } 60% { transform: translate(-5px, -4px); } 80% { transform: translate(4px, 5px); } }
</style>

<!-- Load the Paper.js library -->
<script type="text/javascript" src="https://unpkg.com/paper@0.12.18/dist/paper-full.min.js"></script>

<!-- Load seedrandom for reproducible random numbers -->
<script type="text/javascript" src="https://unpkg.com/seedrandom@3.0.5/seedrandom.min.js"></script>

<script type="text/javascript" src="js/helpers.js"></script>

<!-- Load external PaperScript and associate it with myCanvas -->
<script type="text/paperscript" src="js/script.js" canvas="myCanvas">

</script>
</head>
<body>

<canvas id="myCanvas" resize="true"></canvas>
<div id="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><div id="fuelbar"><div id="fuel"></div></div><div id="region"></div><div id="where"></div></div>
<div id="banner"></div>
<div id="over" hidden>GAME OVER<br><small>press R to restart</small></div>
<div id="flash"></div>

</body>
</html>
